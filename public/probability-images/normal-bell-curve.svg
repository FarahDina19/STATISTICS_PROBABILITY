<title id="title">Normal model: approximately 0.135 percent in each tail beyond three sigma</title><desc id="desc">The standard normal density has about 68.27%, 95.45%, and 99.73% within one, two, and three standard deviations. Each tail beyond three sigma is approximately 0.135%. The rounded 68–95–99.7 empirical rule instead gives roughly 0.15% per tail.</desc>
