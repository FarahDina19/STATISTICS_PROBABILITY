<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">Ten basketball shots: seven made, three missed</title><desc id="desc">Exactly ten numbered shots, seven made and three missed. Binomial bars for n = 10, p = 0.7; P(X = 7) is approximately 0.2668. This pictured outcome is not guaranteed.</desc>
<rect width="960" height="720" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="480" y="48" font-size="30" text-anchor="middle">Basketball: exactly 7 makes in 10 shots</text><text x="480" y="85" font-size="22" text-anchor="middle">10 independent shots • probability of a make p = 0.7</text><g data-shot="1" data-result="Made"><circle cx="75" cy="135" r="27" fill="#166534"/><text x="75" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="75" y="185" font-size="16" text-anchor="middle">1: Made</text></g><g data-shot="2" data-result="Made"><circle cx="165" cy="135" r="27" fill="#166534"/><text x="165" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="165" y="185" font-size="16" text-anchor="middle">2: Made</text></g><g data-shot="3" data-result="Made"><circle cx="255" cy="135" r="27" fill="#166534"/><text x="255" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="255" y="185" font-size="16" text-anchor="middle">3: Made</text></g><g data-shot="4" data-result="Made"><circle cx="345" cy="135" r="27" fill="#166534"/><text x="345" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="345" y="185" font-size="16" text-anchor="middle">4: Made</text></g><g data-shot="5" data-result="Made"><circle cx="435" cy="135" r="27" fill="#166534"/><text x="435" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="435" y="185" font-size="16" text-anchor="middle">5: Made</text></g><g data-shot="6" data-result="Made"><circle cx="525" cy="135" r="27" fill="#166534"/><text x="525" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="525" y="185" font-size="16" text-anchor="middle">6: Made</text></g><g data-shot="7" data-result="Made"><circle cx="615" cy="135" r="27" fill="#166534"/><text x="615" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="615" y="185" font-size="16" text-anchor="middle">7: Made</text></g><g data-shot="8" data-result="Missed"><circle cx="705" cy="135" r="27" fill="#b91c1c"/><text x="705" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="705" y="185" font-size="16" text-anchor="middle">8: Missed</text></g><g data-shot="9" data-result="Missed"><circle cx="795" cy="135" r="27" fill="#b91c1c"/><text x="795" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="795" y="185" font-size="16" text-anchor="middle">9: Missed</text></g><g data-shot="10" data-result="Missed"><circle cx="885" cy="135" r="27" fill="#b91c1c"/><text x="885" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="885" y="185" font-size="16" text-anchor="middle">10: Missed</text></g><text x="480" y="222" font-size="22" text-anchor="middle">One possible outcome: 7 made + 3 missed = 10 shots</text><text x="480" y="262" font-size="22" text-anchor="middle">X = number of makes; X ∼ Bin(10, 0.7)</text><path d="M85 590H920" stroke="#cbd5e1"/><text x="72" y="596" font-size="16" text-anchor="end">0.0</text><path d="M85 500H920" stroke="#cbd5e1"/><text x="72" y="506" font-size="16" text-anchor="end">0.1</text><path d="M85 410H920" stroke="#cbd5e1"/><text x="72" y="416" font-size="16" text-anchor="end">0.2</text><path d="M85 320H920" stroke="#cbd5e1"/><text x="72" y="326" font-size="16" text-anchor="end">0.3</text><text x="85" y="296" font-size="18" >P(X = k)</text><path d="M85 310V590H920" stroke="#172033" fill="none"/><rect data-k="0" data-probability="0.0000059048999999999975" x="100" y="589.99468559" width="48" height="0.005314409999999998" fill="#0369a1"/><text x="124" y="579.99468559" font-size="14" text-anchor="middle">0.0000</text><text x="124" y="617" font-size="18" text-anchor="middle">0</text><rect data-k="1" data-probability="0.00013778099999999996" x="174" y="589.8759971" width="48" height="0.12400289999999996" fill="#0369a1"/><text x="198" y="579.8759971" font-size="14" text-anchor="middle">0.0001</text><text x="198" y="617" font-size="18" text-anchor="middle">1</text><rect data-k="2" data-probability="0.0014467004999999993" x="248" y="588.69796955" width="48" height="1.3020304499999993" fill="#0369a1"/><text x="272" y="578.69796955" font-size="14" text-anchor="middle">0.0014</text><text x="272" y="617" font-size="18" text-anchor="middle">2</text><rect data-k="3" data-probability="0.009001691999999995" x="322" y="581.8984772" width="48" height="8.101522799999996" fill="#0369a1"/><text x="346" y="571.8984772" font-size="14" text-anchor="middle">0.0090</text><text x="346" y="617" font-size="18" text-anchor="middle">3</text><rect data-k="4" data-probability="0.03675690899999998" x="396" y="556.9187819" width="48" height="33.08121809999999" fill="#0369a1"/><text x="420" y="546.9187819" font-size="14" text-anchor="middle">0.0368</text><text x="420" y="617" font-size="18" text-anchor="middle">4</text><rect data-k="5" data-probability="0.10291934519999994" x="470" y="497.37258932000003" width="48" height="92.62741067999995" fill="#0369a1"/><text x="494" y="487.37258932000003" font-size="14" text-anchor="middle">0.1029</text><text x="494" y="617" font-size="18" text-anchor="middle">5</text><rect data-k="6" data-probability="0.2001209489999999" x="544" y="409.8911459000001" width="48" height="180.10885409999992" fill="#0369a1"/><text x="568" y="399.8911459000001" font-size="14" text-anchor="middle">0.2001</text><text x="568" y="617" font-size="18" text-anchor="middle">6</text><rect data-k="7" data-probability="0.2668279319999998" x="618" y="349.8548612000002" width="48" height="240.14513879999984" fill="#b45309"/><text x="642" y="339.8548612000002" font-size="14" text-anchor="middle">0.2668</text><text x="642" y="617" font-size="18" text-anchor="middle">7</text><rect data-k="8" data-probability="0.23347444049999988" x="692" y="379.87300355000013" width="48" height="210.1269964499999" fill="#0369a1"/><text x="716" y="369.87300355000013" font-size="14" text-anchor="middle">0.2335</text><text x="716" y="617" font-size="18" text-anchor="middle">8</text><rect data-k="9" data-probability="0.12106082099999993" x="766" y="481.04526110000006" width="48" height="108.95473889999994" fill="#0369a1"/><text x="790" y="471.04526110000006" font-size="14" text-anchor="middle">0.1211</text><text x="790" y="617" font-size="18" text-anchor="middle">9</text><rect data-k="10" data-probability="0.02824752489999998" x="840" y="564.57722759" width="48" height="25.422772409999983" fill="#0369a1"/><text x="864" y="554.57722759" font-size="14" text-anchor="middle">0.0282</text><text x="864" y="617" font-size="18" text-anchor="middle">10</text><text x="480" y="650" font-size="18" text-anchor="middle">k = number of makes</text><text x="480" y="693" font-size="26" text-anchor="middle">P(X = 7) = C(10, 7) × 0.7⁷ × 0.3³ ≈ 0.2668</text>
</g></svg>
