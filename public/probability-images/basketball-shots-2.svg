<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">Ten basketball shots: seven made, three missed</title><desc id="desc">Exactly ten numbered shots, seven made and three missed. Binomial bars for n = 10, p = 0.6; P(X = 7) is approximately 0.2150. This pictured outcome is not guaranteed.</desc>
<rect width="960" height="720" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="480" y="48" font-size="30" text-anchor="middle">Basketball: exactly 7 makes in 10 shots</text><text x="480" y="85" font-size="22" text-anchor="middle">10 independent shots • probability of a make p = 0.6</text><g data-shot="1" data-result="Made"><circle cx="75" cy="135" r="27" fill="#166534"/><text x="75" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="75" y="185" font-size="16" text-anchor="middle">1: Made</text></g><g data-shot="2" data-result="Made"><circle cx="165" cy="135" r="27" fill="#166534"/><text x="165" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="165" y="185" font-size="16" text-anchor="middle">2: Made</text></g><g data-shot="3" data-result="Made"><circle cx="255" cy="135" r="27" fill="#166534"/><text x="255" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="255" y="185" font-size="16" text-anchor="middle">3: Made</text></g><g data-shot="4" data-result="Made"><circle cx="345" cy="135" r="27" fill="#166534"/><text x="345" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="345" y="185" font-size="16" text-anchor="middle">4: Made</text></g><g data-shot="5" data-result="Made"><circle cx="435" cy="135" r="27" fill="#166534"/><text x="435" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="435" y="185" font-size="16" text-anchor="middle">5: Made</text></g><g data-shot="6" data-result="Made"><circle cx="525" cy="135" r="27" fill="#166534"/><text x="525" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="525" y="185" font-size="16" text-anchor="middle">6: Made</text></g><g data-shot="7" data-result="Made"><circle cx="615" cy="135" r="27" fill="#166534"/><text x="615" y="143" font-size="28" text-anchor="middle" fill="white">✓</text><text x="615" y="185" font-size="16" text-anchor="middle">7: Made</text></g><g data-shot="8" data-result="Missed"><circle cx="705" cy="135" r="27" fill="#b91c1c"/><text x="705" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="705" y="185" font-size="16" text-anchor="middle">8: Missed</text></g><g data-shot="9" data-result="Missed"><circle cx="795" cy="135" r="27" fill="#b91c1c"/><text x="795" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="795" y="185" font-size="16" text-anchor="middle">9: Missed</text></g><g data-shot="10" data-result="Missed"><circle cx="885" cy="135" r="27" fill="#b91c1c"/><text x="885" y="143" font-size="28" text-anchor="middle" fill="white">×</text><text x="885" y="185" font-size="16" text-anchor="middle">10: Missed</text></g><text x="480" y="222" font-size="22" text-anchor="middle">One possible outcome: 7 made + 3 missed = 10 shots</text><text x="480" y="262" font-size="22" text-anchor="middle">X = number of makes; X ∼ Bin(10, 0.6); average = 10 × 0.6 = 6</text><path d="M85 590H920" stroke="#cbd5e1"/><text x="72" y="596" font-size="16" text-anchor="end">0.0</text><path d="M85 500H920" stroke="#cbd5e1"/><text x="72" y="506" font-size="16" text-anchor="end">0.1</text><path d="M85 410H920" stroke="#cbd5e1"/><text x="72" y="416" font-size="16" text-anchor="end">0.2</text><path d="M85 320H920" stroke="#cbd5e1"/><text x="72" y="326" font-size="16" text-anchor="end">0.3</text><text x="85" y="296" font-size="18" >P(X = k)</text><path d="M85 310V590H920" stroke="#172033" fill="none"/><rect data-k="0" data-probability="0.00010485760000000006" x="100" y="589.90562816" width="48" height="0.09437184000000005" fill="#0369a1"/><text x="124" y="579.90562816" font-size="14" text-anchor="middle">0.0001</text><text x="124" y="617" font-size="18" text-anchor="middle">0</text><rect data-k="1" data-probability="0.0015728640000000006" x="174" y="588.5844224" width="48" height="1.4155776000000007" fill="#0369a1"/><text x="198" y="578.5844224" font-size="14" text-anchor="middle">0.0016</text><text x="198" y="617" font-size="18" text-anchor="middle">1</text><rect data-k="2" data-probability="0.010616832000000005" x="248" y="580.4448512" width="48" height="9.555148800000005" fill="#0369a1"/><text x="272" y="570.4448512" font-size="14" text-anchor="middle">0.0106</text><text x="272" y="617" font-size="18" text-anchor="middle">2</text><rect data-k="3" data-probability="0.042467328000000006" x="322" y="551.7794048" width="48" height="38.220595200000005" fill="#0369a1"/><text x="346" y="541.7794048" font-size="14" text-anchor="middle">0.0425</text><text x="346" y="617" font-size="18" text-anchor="middle">3</text><rect data-k="4" data-probability="0.11147673600000003" x="396" y="489.6709376" width="48" height="100.32906240000003" fill="#0369a1"/><text x="420" y="479.6709376" font-size="14" text-anchor="middle">0.1115</text><text x="420" y="617" font-size="18" text-anchor="middle">4</text><rect data-k="5" data-probability="0.20065812480000003" x="470" y="409.40768768" width="48" height="180.59231232000002" fill="#0369a1"/><text x="494" y="399.40768768" font-size="14" text-anchor="middle">0.2007</text><text x="494" y="617" font-size="18" text-anchor="middle">5</text><rect data-k="6" data-probability="0.25082265600000003" x="544" y="364.2596096" width="48" height="225.74039040000002" fill="#0369a1"/><text x="568" y="354.2596096" font-size="14" text-anchor="middle">0.2508</text><text x="568" y="617" font-size="18" text-anchor="middle">6</text><rect data-k="7" data-probability="0.21499084799999998" x="618" y="396.5082368" width="48" height="193.49176319999998" fill="#b45309"/><text x="642" y="386.5082368" font-size="14" text-anchor="middle">0.2150</text><text x="642" y="617" font-size="18" text-anchor="middle">7</text><rect data-k="8" data-probability="0.12093235199999998" x="692" y="481.1608832" width="48" height="108.83911679999999" fill="#0369a1"/><text x="716" y="471.1608832" font-size="14" text-anchor="middle">0.1209</text><text x="716" y="617" font-size="18" text-anchor="middle">8</text><rect data-k="9" data-probability="0.04031078399999999" x="766" y="553.7202944000001" width="48" height="36.27970559999999" fill="#0369a1"/><text x="790" y="543.7202944000001" font-size="14" text-anchor="middle">0.0403</text><text x="790" y="617" font-size="18" text-anchor="middle">9</text><rect data-k="10" data-probability="0.006046617599999997" x="840" y="584.55804416" width="48" height="5.441955839999998" fill="#0369a1"/><text x="864" y="574.55804416" font-size="14" text-anchor="middle">0.0060</text><text x="864" y="617" font-size="18" text-anchor="middle">10</text><text x="480" y="650" font-size="18" text-anchor="middle">k = number of makes</text><text x="480" y="693" font-size="26" text-anchor="middle">P(X = 7) = C(10, 7) × 0.6⁷ × 0.4³ ≈ 0.2150</text>
</g></svg>
